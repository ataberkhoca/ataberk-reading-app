name: Build desktop packages

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
    branches: [main]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Sync web assets into the Electron platform
        run: npm run cap:sync:electron

      - name: Install Electron platform dependencies
        working-directory: electron
        run: npm install

      - name: Build Linux packages (.deb + .AppImage)
        working-directory: electron
        run: npm run electron:build:linux

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ataberk-hoca-linux
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.deb
            electron/dist/*.AppImage
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Sync web assets into the Electron platform
        run: npm run cap:sync:electron

      - name: Install Electron platform dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer (.exe)
        working-directory: electron
        run: npm run electron:build:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ataberk-hoca-windows
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
          generate_release_notes: true
