name: Build Linux desktop package

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "data/**"
      - "www/**"
      - "index.html"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Sync web assets into the Electron platform
        run: npm run cap:sync:electron

      - name: Install Electron platform dependencies
        working-directory: electron
        run: npm install

      - name: Build Linux packages (.deb + .AppImage)
        working-directory: electron
        run: npm run electron:build:linux

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ataberk-hoca-linux
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
          if-no-files-found: error
